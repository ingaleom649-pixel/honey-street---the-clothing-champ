<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Honeystreet</title>
  <meta name="description" content="Shop premium fashion at Honeystreet." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dark-mode.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="header-slot"></div>

  <main class="fade-page">
    <section class="page-hero">
      <div class="container">
        <h1>Shop All</h1>
        <div class="breadcrumb"><a href="index.html">Home</a> / <span>Shop</span></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="shop-layout">
          <!-- Sidebar filters -->
          <aside class="shop-sidebar" id="shop-sidebar">
            <button class="filter-toggle" data-filter-close style="margin-bottom:16px;width:100%;justify-content:center;">✕ Close Filters</button>

            <div class="sidebar-section">
              <h4>Category</h4>
              <div class="filter-group" id="filter-category"></div>
            </div>

            <div class="sidebar-section">
              <h4>Brand</h4>
              <div class="filter-group" id="filter-brand"></div>
            </div>

            <div class="sidebar-section">
              <h4>Size</h4>
              <div class="filter-group" id="filter-size"></div>
            </div>

            <div class="sidebar-section">
              <h4>Color</h4>
              <div class="filter-group" id="filter-color"></div>
            </div>

            <div class="sidebar-section">
              <h4>Price Range</h4>
              <div class="price-range">
                <input type="range" id="price-min" min="0" max="6000" step="100" value="0" />
                <input type="range" id="price-max" min="0" max="6000" step="100" value="6000" />
                <div class="price-values">
                  <span id="price-min-label">₹0</span>
                  <span id="price-max-label">₹6000</span>
                </div>
              </div>
            </div>

            <div class="sidebar-section">
              <h4>Rating</h4>
              <div class="filter-group" id="filter-rating"></div>
            </div>
          </aside>

          <!-- Products -->
          <div>
            <div class="shop-toolbar">
              <button class="filter-toggle" data-filter-open>⚙ Filters</button>
              <span class="result-count" id="result-count">Loading products...</span>
              <div class="shop-sort">
                <label for="sort-select">Sort by</label>
                <select id="sort-select">
                  <option value="newest">Newest</option>
                  <option value="price_asc">Price: Low to High</option>
                  <option value="price_desc">Price: High to Low</option>
                  <option value="popularity">Popularity</option>
                  <option value="rating">Rating</option>
                </select>
              </div>
            </div>

            <div class="product-grid" id="shop-products">
              <!-- Filled by JS -->
            </div>

            <div class="pagination" id="shop-pagination"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-slot"></div>

  <div class="sidebar-overlay" data-sidebar-overlay></div>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/products.js"></script>
  <script type="module" src="js/shop.js"></script>
</body>
</html>
